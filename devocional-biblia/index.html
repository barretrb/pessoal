<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />

    <script>
      try {
        const s = JSON.parse(localStorage.getItem('devocional_settings_v1') || '{}');
        if (s.theme === 'dark') document.documentElement.classList.add('dark');
        else if (s.theme === 'sepia') document.documentElement.classList.add('sepia');
      } catch (e) {}
    </script>

  <body class="bg-[#F9FAFB] dark:bg-[#09090B] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-amber-500/20 selection:text-amber-900 dark:selection:bg-amber-500/30 dark:selection:text-amber-100">
