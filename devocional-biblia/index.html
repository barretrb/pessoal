<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bíblia & Devocional NVT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Bíblia de Estudos & Devocional 365 (NVT)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261124" />
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('devocional_settings_v1') || '{}');
        if (s.theme === 'dark') document.documentElement.classList.add('dark');
        else if (s.theme === 'sepia') document.documentElement.classList.add('sepia');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F8F6F1] dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-amber-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
