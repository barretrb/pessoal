name: Agente A Unica Coisa

on:
  schedule:
    # 08:15 BRT (11:15 UTC) de segunda a sexta -> Ritual Matinal
    - cron: '15 11 * * 1-5'
    # 18:00 BRT (21:00 UTC) de segunda a sexta -> Check-in Noturno
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Qual ritual executar?'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night
          - weekly
          - test-auth

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r A_Unica_Coisa/requirements.txt

      - name: Restore credentials and configs from GitHub Secrets
        run: |
          mkdir -p A_Unica_Coisa/config
          mkdir -p A_Unica_Coisa/state
          echo "$CONFIG_JSON" > A_Unica_Coisa/config/config.json
          echo "$CREDENTIALS_JSON" > A_Unica_Coisa/credentials.json
          echo "$TOKEN_JSON" > A_Unica_Coisa/token.json
        env:
          CONFIG_JSON: ${{ secrets.A_UNICA_COISA_CONFIG_JSON }}
          CREDENTIALS_JSON: ${{ secrets.A_UNICA_COISA_CREDENTIALS_JSON }}
          TOKEN_JSON: ${{ secrets.A_UNICA_COISA_TOKEN_JSON }}

      - name: Execute Agent Ritual
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_ACTION="${{ github.event.inputs.action }}"
          else
            CURRENT_UTC_HOUR=$(date -u +%H)
            if [ "$CURRENT_UTC_HOUR" -ge 20 ]; then
              SELECTED_ACTION="night"
            else
              SELECTED_ACTION="morning"
            fi
          fi

          echo "Executando ritual: $SELECTED_ACTION"
          cd A_Unica_Coisa
          python main.py --$SELECTED_ACTION
